<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Re:EthePath</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=19.4">
<link rel="stylesheet" href="style.css?v=19.4">
</head>
<body>

<div id="hud">
  <div class="hud-left">
    <div class="bar-label">澪奈 <span id="hpText">50/50</span></div>
    <div class="bar hp-bar"><div id="hpFill"></div></div>
    <div class="bar-label">以太 <span id="energyText">3/3</span> <span id="buffText"></span></div>
    <div class="bar energy-bar"><div id="energyFill"></div></div>
    <div id="blockText">屏障: 0</div>
    <div id="playerStatus" class="status-row"></div>
  </div>
  <div class="hud-center">
    <div id="turnText">回响 1</div>
    <div id="intentText">残响意图: 攻击 7</div>
  </div>
  <div class="hud-right">
    <div class="bar-label"><span id="enemyName">残响 · 虚空造物</span> <span id="enemyHpText">120/120</span></div>
    <div class="bar enemy-bar"><div id="enemyHpFill"></div></div>
    <div id="enemyDmgInfo">侵蚀力: 7</div>
    <div id="enemyStatus" class="status-row"></div>
  </div>
</div>

<canvas id="game"></canvas>

<div id="log"></div>
<div id="pileInfo">结晶 0 · 记忆 0 · 残片 0 · 消散 0</div>
<div id="handTray"></div>
<div id="playerTags"></div>
<div id="deckPile" class="pile"><div class="plabel">牌堆</div><div class="pback"></div><div class="pcount" id="deckCount">0</div></div>
<div id="discardPile" class="pile"><div class="plabel">弃牌</div><div class="pback alt"></div><div class="pcount" id="discCount">0</div></div>
<div id="hand"></div>
<button id="endTurnBtn">结束回响 ⏎</button>
<button id="pauseBtn" style="display:none">⏸</button>

<div id="fx"></div>
<div id="banner"></div>
<div id="vignette"></div>
<div id="cardPreview" class="hidden"></div>

<div id="panel" class="hidden"></div>

<div id="overlay">
  <div class="boot-pre-stars"></div>
  <div class="boot-pre-stars s2"></div>
  <div class="boot-pre-neb n1"></div>
  <div class="boot-pre-neb n2"></div>
  <div class="boot-pre-motes"><i style="left:18%;animation-duration:7.5s"></i><i style="left:32%;animation-duration:9s;animation-delay:-3s"></i><i style="left:47%;animation-duration:6.8s;animation-delay:-5s"></i><i style="left:58%;animation-duration:8.4s;animation-delay:-1.5s"></i><i style="left:66%;animation-duration:7.2s;animation-delay:-4s"></i><i style="left:78%;animation-duration:9.6s;animation-delay:-2.2s"></i><i style="left:88%;animation-duration:7.9s;animation-delay:-6s"></i></div>
  <div class="boot-pre">
    <div class="boot-pre-glow"></div>
    <i class="boot-pre-cry"></i>
    <p class="boot-pre-t">Re:EthePath</p>
    <p class="boot-pre-s">记 忆 溯 流 中 ……</p>
  </div>
</div>

<script src="bgm_data.js?v=19.4"></script>
<script src="game.js?v=19.4"></script>
</body>
</html>
